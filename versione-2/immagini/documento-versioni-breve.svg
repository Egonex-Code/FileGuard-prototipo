<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-labelledby="t">
  <title id="t">Tre versioni del contratto: è scelta quella di martedì, che torna accanto all'originale con un altro nome</title>
  <!-- Disegno di Egonex, versione breve per schede strette. Colori dalla palette di stile.css. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(0 20)">
      <rect x="36" y="14" width="64" height="44" rx="8" fill="#0B2C6B"/>
      <text x="68" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">v3</text>
      <text x="124" y="48" font-size="36" fill="#4B5866">giovedì 15:32</text>
    </g>
    <line x1="20" x2="580" y1="104" y2="104" stroke="#DDE2E8" stroke-width="3"/>
    <g transform="translate(0 106)">
      <rect x="36" y="14" width="64" height="44" rx="8" fill="#0B2C6B"/>
      <text x="68" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">v2</text>
      <text x="124" y="48" font-size="36" fill="#4B5866">mercoledì 11:10</text>
    </g>
    <g transform="translate(0 190)">
      <rect x="20" y="0" width="560" height="76" rx="8" fill="#E9EFF8"/>
      <rect x="20" y="0" width="8" height="76" fill="#0B2C6B"/>
      <rect x="36" y="16" width="64" height="44" rx="8" fill="#0B2C6B"/>
      <text x="68" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">v1</text>
      <text x="124" y="51" font-size="36" font-weight="700" fill="#1C2A3A">martedì 10:05</text>
    </g>
    <text x="36" y="318" font-size="28" fill="#4B5866">Torna accanto all'originale,</text>
    <text x="36" y="354" font-size="28" fill="#4B5866">con un altro nome.</text>
  </g>
</svg>
