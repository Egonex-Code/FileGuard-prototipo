<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d">
  <title id="t">Le versioni di un documento</title>
  <desc id="d">Le versioni del contratto Galli: giovedì, mercoledì e martedì. È scelta la versione di martedì, con il pulsante Ripristina.</desc>
  <!-- Disegno di Egonex, fatto a mano per il sito. Colori dalla palette di stile.css. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="20" width="760" height="420" rx="14" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="3"/>
    <text x="52" y="78" font-size="30" font-weight="700" fill="#0B2C6B">Le versioni di Contratto Galli.docx</text>

    <g transform="translate(20 108)">
      <line x1="0" x2="760" y1="0" y2="0" stroke="#DDE2E8" stroke-width="2"/>
      <rect x="32" y="22" width="54" height="36" rx="6" fill="#0B2C6B"/>
      <text x="59" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">v3</text>
      <text x="106" y="49" font-size="28" fill="#4B5866">giovedì 5 novembre, 15:32</text>
    </g>
    <g transform="translate(20 188)">
      <line x1="0" x2="760" y1="0" y2="0" stroke="#DDE2E8" stroke-width="2"/>
      <rect x="32" y="22" width="54" height="36" rx="6" fill="#0B2C6B"/>
      <text x="59" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">v2</text>
      <text x="106" y="49" font-size="28" fill="#4B5866">mercoledì 4 novembre, 11:10</text>
    </g>
    <g transform="translate(20 268)">
      <rect x="2" y="0" width="756" height="80" fill="#E9EFF8"/>
      <rect x="2" y="0" width="6" height="80" fill="#0B2C6B"/>
      <rect x="32" y="22" width="54" height="36" rx="6" fill="#0B2C6B"/>
      <text x="59" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">v1</text>
      <text x="106" y="49" font-size="28" font-weight="600" fill="#1C2A3A">martedì 3 novembre, 10:05</text>
    </g>

    <rect x="590" y="370" width="160" height="50" rx="8" fill="#0B2C6B"/>
    <text x="670" y="403" text-anchor="middle" font-size="24" font-weight="600" fill="#FFFFFF">Ripristina</text>
  </g>
</svg>
