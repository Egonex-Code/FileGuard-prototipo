<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="t d">
  <title id="t">Un avviso email di FileGuard</title>
  <desc id="d">Email di avviso inviata all'indirizzo scelto dallo studio: cancellato un file o una cartella protetta. Contiene frasi fisse e il nome dello studio: nessun nome di file. I destinatari non sono scritti nell'email.</desc>
  <!-- Disegno di Egonex, fatto a mano per il sito. Colori dalla palette di stile.css. Dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="10" y="10" width="580" height="330" rx="16" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="3"/>
    <path d="M10 26a16 16 0 0 1 16-16h548a16 16 0 0 1 16 16v54H10Z" fill="#0B2C6B"/>
    <g transform="translate(36 30)">
      <rect width="44" height="32" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M2 3l20 15 20-15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="98" y="56" font-size="28" font-weight="700" fill="#FFFFFF">Avviso da FileGuard</text>

    <text x="36" y="146" font-size="32" font-weight="700" fill="#1C2A3A">Cancellato un file o</text>
    <text x="36" y="186" font-size="32" font-weight="700" fill="#1C2A3A">una cartella protetta</text>
    <line x1="36" x2="564" y1="222" y2="222" stroke="#DDE2E8" stroke-width="3"/>
    <text x="36" y="276" font-size="28" fill="#4B5866">Studio Esempio</text>
  </g>
</svg>
