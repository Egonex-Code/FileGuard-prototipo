<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
  <title id="t">I documenti di una persona</title>
  <desc id="d">Si cerca Bianchi. FileGuard trova i suoi documenti in cartelle diverse: 9 sicuri, nelle cartelle Contratti, Fatture e Scansioni; 3 da controllare, nella cartella Archivio.</desc>
  <!-- Disegno di Egonex, fatto a mano per il sito. Colori dalla palette di stile.css. Dati di prova. -->
  <defs>
    <g id="doc">
      <path d="M0 0h22l10 10v30H0Z" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M7 18h18M7 26h18M7 34h12" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="doc-dubbio">
      <path d="M0 0h22l10 10v30H0Z" fill="#FFFFFF" stroke="#4B5866" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5"/>
      <path d="M7 18h18M7 26h18M7 34h12" stroke="#4B5866" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Casella di ricerca -->
    <rect x="220" y="20" width="360" height="72" rx="12" fill="#FFFFFF" stroke="#C3CBD4" stroke-width="3"/>
    <circle cx="262" cy="52" r="13" fill="none" stroke="#4B5866" stroke-width="3"/>
    <path d="M272 62l11 11" stroke="#4B5866" stroke-width="3" stroke-linecap="round"/>
    <text x="304" y="68" font-size="34" fill="#1C2A3A">Bianchi</text>

    <!-- Collegamenti -->
    <path d="M400 92v34M200 126h400M200 126v40M600 126v40" fill="none" stroke="#0B2C6B" stroke-width="3"/>

    <!-- Sicuri -->
    <rect x="30" y="166" width="340" height="370" rx="14" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="3"/>
    <text x="60" y="232" font-size="52" font-weight="700" fill="#0B2C6B">9</text>
    <text x="104" y="228" font-size="34" fill="#1C2A3A">sicuri</text>
    <use href="#doc" x="62" y="270"/>
    <text x="112" y="302" font-size="30" fill="#1C2A3A">Contratti</text>
    <use href="#doc" x="62" y="345"/>
    <text x="112" y="377" font-size="30" fill="#1C2A3A">Fatture</text>
    <use href="#doc" x="62" y="420"/>
    <text x="112" y="452" font-size="30" fill="#1C2A3A">Scansioni</text>

    <!-- Da controllare -->
    <rect x="430" y="166" width="340" height="370" rx="14" fill="#FFFFFF" stroke="#C3CBD4" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="460" y="232" font-size="52" font-weight="700" fill="#0B2C6B">3</text>
    <text x="504" y="228" font-size="34" fill="#1C2A3A">da controllare</text>
    <use href="#doc-dubbio" x="462" y="270"/>
    <text x="512" y="302" font-size="30" fill="#4B5866">Archivio</text>
    <use href="#doc-dubbio" x="462" y="345"/>
    <text x="512" y="377" font-size="30" fill="#4B5866">Archivio</text>
  </g>
</svg>
