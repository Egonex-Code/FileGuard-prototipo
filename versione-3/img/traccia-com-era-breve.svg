<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230" role="img" aria-labelledby="t">
  <title id="t">Due versioni del contratto lungo il filo: martedì e mercoledì. Quella di martedì torna accanto all'originale, con un altro nome.</title>
  <!-- Versione breve per il telefono. Dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="20" x2="280" y1="120" y2="120" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(46 14)">
      <rect width="68" height="82" rx="8" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="3"/>
      <path d="M12 24h44M12 38h44M12 52h30" stroke="#0B2C6B" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-6" y="-6" width="80" height="94" rx="12" fill="none" stroke="#F2A23A" stroke-width="3"/>
    </g>
    <circle cx="80" cy="120" r="10" fill="#F2A23A"/>
    <text x="80" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#16212F">v1</text>
    <text x="80" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#8A5200">mar 10:05</text>
    <g transform="translate(186 20)">
      <rect width="68" height="76" rx="8" fill="#FFFFFF" stroke="#B9C5D6" stroke-width="2.5"/>
      <path d="M12 22h44M12 36h44M12 50h30" stroke="#B9C5D6" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <circle cx="220" cy="120" r="9" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <text x="220" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#4A5668">v2</text>
    <text x="220" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#8A5200">mer 11:10</text>
    <text x="14" y="214" font-size="17" fill="#16212F">Torna accanto, con un altro nome</text>
  </g>
</svg>
