<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t">
  <title id="t">La pratica Bianchi passa dalla cartella Clienti\Bianchi alla cartella Archivio 2025. Il filo ricorda il giorno, l'ora e il computer: venerdì 18:49, Segreteria.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Dati di prova.
       Regola: cartelle distanziate, filo libero tra le due, etichetta sopra il filo e mai sovrapposta,
       pallini fuori dalle icone con lo stesso stacco (12 unità dal bordo). -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Etichetta del ricordo, sopra il filo -->
    <rect x="76" y="26" width="328" height="74" rx="37" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <circle cx="110" cy="63" r="8" fill="#F2A23A"/>
    <text x="130" y="56" font-size="22" font-weight="700" fill="#16212F">Spostato</text>
    <text x="130" y="84" font-family="Consolas, monospace" font-size="21" fill="#8A5200">ven 18:49 · Segreteria</text>
    <!-- Piccolo segno che lega l'etichetta al filo -->
    <path d="M240 104V174" stroke="#B9C5D6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 7"/>

    <!-- Cartella di partenza: il documento non c'è più -->
    <g transform="translate(16 140)">
      <path d="M0 12a10 10 0 0 1 10-10h44l12 12h84a10 10 0 0 1 10 10v82a10 10 0 0 1-10 10H10A10 10 0 0 1 0 106Z" fill="#FFFFFF" stroke="#B9C5D6" stroke-width="2.5"/>
      <rect x="54" y="36" width="52" height="62" rx="6" fill="none" stroke="#B9C5D6" stroke-width="2.5" stroke-dasharray="6 6"/>
    </g>
    <text x="96" y="300" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5668">Clienti\Bianchi</text>

    <!-- Il filo della memoria, libero tra le due cartelle -->
    <path d="M188 200C228 200 252 200 292 200" fill="none" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="188" cy="200" r="8" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <circle cx="240" cy="200" r="5" fill="#F2A23A"/>
    <circle cx="292" cy="200" r="8" fill="#F2A23A"/>

    <!-- Cartella di arrivo, con il documento -->
    <g transform="translate(304 140)">
      <path d="M0 12a10 10 0 0 1 10-10h44l12 12h84a10 10 0 0 1 10 10v82a10 10 0 0 1-10 10H10A10 10 0 0 1 0 106Z" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5"/>
      <rect x="54" y="34" width="54" height="66" rx="6" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
      <path d="M66 56h30M66 70h30M66 84h20" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="384" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#16212F">Archivio 2025</text>
  </g>
</svg>
