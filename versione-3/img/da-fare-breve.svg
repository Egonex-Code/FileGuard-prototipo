<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330" role="img" aria-labelledby="t">
  <title id="t">In Da fare c'è la riga: Cancellato, contratto.pdf, con il pulsante Rimetti a posto. Il documento torna nella cartella dov'era, con lo stesso nome.</title>
