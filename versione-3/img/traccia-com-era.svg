<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t">
  <title id="t">Tre versioni del contratto lungo il filo: martedì, mercoledì e giovedì. Quella di martedì torna accanto all'originale, con un altro nome.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="40" x2="440" y1="140" y2="140" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <!-- v1: quella giusta -->
    <g transform="translate(60 26)">
      <rect x="0" y="0" width="76" height="92" rx="8" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="3"/>
      <path d="M14 26h48M14 42h48M14 58h34" stroke="#0B2C6B" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-6" y="-6" width="88" height="104" rx="12" fill="none" stroke="#F2A23A" stroke-width="3"/>
    </g>
    <circle cx="98" cy="140" r="10" fill="#F2A23A"/>
    <text x="98" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#16212F">v1</text>
    <text x="98" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#8A5200">mar 10:05</text>
    <!-- v2 -->
    <g transform="translate(202 34)">
      <rect width="76" height="84" rx="8" fill="#FFFFFF" stroke="#B9C5D6" stroke-width="2.5"/>
      <path d="M14 24h48M14 40h48M14 56h34" stroke="#B9C5D6" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <circle cx="240" cy="140" r="9" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <text x="240" y="176" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5668">v2</text>
    <text x="240" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#8A5200">mer 11:10</text>
    <!-- v3 -->
    <g transform="translate(344 34)">
      <rect width="76" height="84" rx="8" fill="#FFFFFF" stroke="#B9C5D6" stroke-width="2.5"/>
      <path d="M14 24h48M14 40h48M14 56h34" stroke="#B9C5D6" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <circle cx="382" cy="140" r="9" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <text x="382" y="176" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5668">v3</text>
    <text x="382" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#8A5200">gio 15:32</text>
    <!-- La versione scelta torna accanto, con un altro nome -->
    <g transform="translate(30 208) scale(0.62)"><path d="M0 0h34l12 12v46H0Z" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 0v12h12M9 22h28M9 31h28M9 40h18" fill="none" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="72" y="236" font-size="18" fill="#16212F">torna accanto, con un altro nome</text>
  </g>
</svg>
