<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" role="img" aria-labelledby="t">
  <title id="t">Il tuo studio: i computer, i documenti e il loro diario restano dentro. A Egonex arrivano i dati della licenza e degli aggiornamenti.</title>
  <!-- Concetto «La traccia», Grafico Egonex. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Lo studio -->
    <rect x="12" y="12" width="356" height="356" rx="24" fill="#FFFFFF" stroke="#16212F" stroke-width="2.5"/>
    <text x="36" y="52" font-size="22" font-weight="800" fill="#16212F">Il tuo studio</text>
    <!-- Il filo resta dentro -->
    <path d="M144 116C204 116 220 170 220 229S226 282 238 282" fill="none" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <!-- Computer 1 -->
    <g transform="translate(40 86)">
      <rect width="92" height="60" rx="8" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5"/>
      <path d="M34 60v12M58 60v12M24 74h44" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <circle cx="144" cy="116" r="8" fill="#F2A23A"/>
    <!-- Documenti -->
    <g transform="translate(160 200)">
      <rect width="48" height="58" rx="6" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
      <path d="M10 18h28M10 30h28M10 42h18" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="220" cy="229" r="8" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <!-- Computer 2 / NAS -->
    <g transform="translate(250 252)">
      <rect width="92" height="60" rx="8" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5"/>
      <path d="M14 20h40M14 36h40" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="74" cy="20" r="4" fill="#0B2C6B"/>
    </g>
    <circle cx="238" cy="282" r="8" fill="#F2A23A"/>
    <text x="36" y="350" font-size="20" fill="#4A5668">documenti e diario</text>
    <!-- Egonex, fuori -->
    <path d="M368 130H400" stroke="#B9C5D6" stroke-width="2.5" stroke-dasharray="6 6"/>
    <rect x="400" y="96" width="120" height="68" rx="12" fill="#EEF2F8" stroke="#B9C5D6" stroke-width="2.5"/>
    <text x="460" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#4A5668">Egonex</text>
    <text x="460" y="200" text-anchor="middle" font-size="18" fill="#4A5668">licenza e</text>
    <text x="460" y="224" text-anchor="middle" font-size="18" fill="#4A5668">aggiornamenti</text>
  </g>
</svg>
