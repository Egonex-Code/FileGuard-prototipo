<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t">
  <title id="t">Si cerca Bianchi: il filo porta ai documenti che lo riguardano, in cartelle diverse.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Ricerca -->
    <rect x="20" y="96" width="160" height="56" rx="28" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
    <circle cx="50" cy="122" r="9" fill="none" stroke="#0B2C6B" stroke-width="3"/>
    <path d="M57 129l8 8" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="132" font-size="22" font-weight="700" fill="#16212F">Bianchi</text>
    <!-- Fili verso i documenti -->
    <path d="M186 124C230 124 230 44 280 44M186 124C230 124 230 104 280 104M186 124C230 124 230 164 280 164M186 124C230 124 230 224 280 224" fill="none" stroke="#F2A23A" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#F2A23A"><circle cx="280" cy="44" r="7"/><circle cx="280" cy="104" r="7"/><circle cx="280" cy="164" r="7"/></g>
    <circle cx="280" cy="224" r="7" fill="#FFFFFF" stroke="#F2A23A" stroke-width="3.5"/>
    <g font-size="22" fill="#16212F">
      <text x="296" y="51">Contratti</text>
      <text x="296" y="111">Fatture</text>
      <text x="296" y="171">Pratiche</text>
    </g>
    <text x="296" y="231" font-size="22" fill="#4A5668">Archivio</text>
  </g>
</svg>
