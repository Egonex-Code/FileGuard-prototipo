<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t">
  <title id="t">La foto di una carta di prova passa dal tuo computer, senza internet: il testo diventa leggibile, Rossi Mario, e la ricerca la trova.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Carta generica con dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(16 44) rotate(-4 75 48)"><rect width="150" height="96" rx="8" fill="#F4F1EA" stroke="#8A97AA" stroke-width="2.5"/><rect x="12" y="14" width="40" height="50" rx="4" fill="#DCE3EC"/><circle cx="32" cy="32" r="9" fill="#B9C5D6"/><path d="M18 62c2-12 26-12 28 0" fill="#B9C5D6"/><path d="M64 22c10-3 18 3 28 0s18 3 28 0M64 40c10-3 18 3 28 0s14 3 22 0M64 58c10-3 18 3 28 0s18 3 28 0M14 80c10-3 18 3 28 0s18 3 28 0s18 3 28 0" fill="none" stroke="#B9C5D6" stroke-width="4" stroke-linecap="round"/></g>
    <text x="91" y="176" text-anchor="middle" font-size="16" fill="#4A5668">Foto della carta</text>
    <path d="M180 92H200M296 92H324" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="180" cy="92" r="7" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <g transform="translate(206 64)"><rect width="84" height="56" rx="8" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5"/><path d="M32 56v10M52 56v10M24 68h36" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round"/><path d="M22 18h40M22 28h40M22 38h26" stroke="#0B2C6B" stroke-width="3" stroke-linecap="round"/></g>
    <text x="248" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#16212F">Il tuo computer</text>
    <text x="248" y="180" text-anchor="middle" font-size="15" fill="#4A5668">senza internet</text>
    <circle cx="324" cy="92" r="8" fill="#F2A23A"/>
    <rect x="336" y="36" width="136" height="128" rx="10" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
    <text x="350" y="60" font-size="14" font-family="Consolas, monospace" fill="#8A5200">testo letto</text>
    <text x="350" y="88" font-size="14" fill="#4A5668">Cognome</text>
    <text x="350" y="108" font-size="18" font-weight="700" fill="#16212F">Rossi</text>
    <text x="350" y="146" font-size="14" fill="#4A5668">Nome</text>
    <text x="400" y="146" font-size="18" font-weight="700" fill="#16212F">Mario</text>
    <path d="M404 170V208" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <rect x="300" y="214" width="172" height="44" rx="22" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
    <circle cx="324" cy="234" r="7" fill="none" stroke="#0B2C6B" stroke-width="2.5"/><path d="M329 239l6 6" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="344" y="242" font-size="17" font-weight="700" fill="#16212F">Rossi</text>
    <text x="458" y="242" text-anchor="end" font-size="15" fill="#8A5200">trovata</text>
  </g>
</svg>
