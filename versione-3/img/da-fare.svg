<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="t">
  <title id="t">In Da fare c'è la riga: Cancellato, contratto.pdf, con il pulsante Rimetti a posto. Il documento torna nella cartella dov'era, con lo stesso nome.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Dati di prova. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="8" y="8" width="464" height="136" rx="14" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2.5"/>
    <text x="28" y="42" font-size="20" font-weight="800" fill="#16212F">Da fare</text>
    <line x1="28" x2="452" y1="58" y2="58" stroke="#D6DEE9" stroke-width="2"/>
    <circle cx="36" cy="92" r="7" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <text x="54" y="90" font-size="18" font-weight="700" fill="#16212F">Cancellato</text>
    <text x="54" y="114" font-size="17" fill="#16212F">contratto.pdf</text>
    <text x="54" y="134" font-size="15" font-family="Consolas, monospace" fill="#8A5200">quando: oggi 15:28</text>
    <rect x="290" y="76" width="166" height="40" rx="20" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5"/>
    <text x="373" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2C6B">Rimetti a posto</text>
    <path d="M373 116V170C373 196 330 206 300 206H196" fill="none" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="196" cy="206" r="8" fill="#F2A23A"/>
    <path d="M28 168h40l12 12h100v84H28Z" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(86 186) scale(0.8)"><path d="M0 0h34l12 12v46H0Z" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 0v12h12M9 22h28M9 31h28M9 40h18" fill="none" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="104" y="256" text-anchor="middle" font-size="15" fill="#16212F">contratto.pdf</text>
    <text x="216" y="232" font-size="17" fill="#16212F">Torna dov'era,</text>
    <text x="216" y="254" font-size="17" fill="#16212F">con lo stesso nome.</text>
  </g>
</svg>
