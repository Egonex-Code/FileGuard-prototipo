    <text x="298" y="279" text-anchor="end" font-size="16" fill="#4A5668">12 sicuri</text>
    <path d="M34 304V360" stroke="#F2A23A" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="34" cy="324" r="7" fill="#F2A23A"/>
    <text x="54" y="330" font-size="17" fill="#16212F">doc00317.pdf</text>
    <circle cx="34" cy="360" r="7" fill="#F2A23A"/>
    <text x="54" y="366" font-size="17" fill="#16212F">contratto def2.docx</text>
    <g transform="translate(14 400) scale(0.52)" opacity="0.45"><path d="M0 0h34l12 12v46H0Z" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 0v12h12M9 22h28M9 31h28M9 40h18" fill="none" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="48" y="422" font-size="17" fill="#8A97AA">Modello lettera.docx: nessuno</text>
