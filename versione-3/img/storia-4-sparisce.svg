<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="t">
  <title id="t">La pratica non è più nella cartella Clienti: il filo porta alla cartella Archivio 2025, con giorno, ora e computer.</title>
  <!-- Concetto «La traccia», Grafico Egonex. Stessa regola di traccia-dove: cartelle distanziate,
       etichetta sopra il filo e mai sovrapposta, pallini fuori dalle icone a 12 unità dal bordo. -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Etichetta sopra il filo, legata da un piccolo segno -->
    <text x="160" y="24" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#8A5200">ven 18:49 · Segreteria</text>
    <path d="M160 34V88" stroke="#B9C5D6" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/>
    <!-- Clienti: il documento non c'è più -->
    <path d="M14 56h30l10 10h50v66H14Z" fill="#FFFFFF" stroke="#8A97AA" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="40" y="76" width="34" height="44" rx="4" fill="none" stroke="#8A97AA" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="59" y="156" text-anchor="middle" font-size="15" fill="#4A5668">Clienti</text>
    <!-- Il filo, libero tra le due cartelle -->
    <path d="M116 98C140 98 180 98 204 98" fill="none" stroke="#F2A23A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="116" cy="98" r="7" fill="#FFFFFF" stroke="#F2A23A" stroke-width="4"/>
    <circle cx="160" cy="98" r="4" fill="#F2A23A"/>
    <circle cx="204" cy="98" r="8" fill="#F2A23A"/>
    <!-- Archivio 2025, con il documento -->
    <path d="M216 56h30l10 10h50v66H216Z" fill="#E4ECF8" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(244 72) scale(0.85)"><path d="M0 0h34l12 12v46H0Z" fill="#FFFFFF" stroke="#0B2C6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 0v12h12M9 22h28M9 31h28M9 40h18" fill="none" stroke="#0B2C6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="261" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#16212F">Archivio 2025</text>
  </g>
</svg>
